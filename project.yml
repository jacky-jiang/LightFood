name: LightFood

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.10
    CODE_SIGN_STYLE: Automatic

targets:
  LightFood:
    type: application
    platform: iOS
    sources:
      - LightFood
    resources:
      - LightFood/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LightFood
        INFOPLIST_KEY_CFBundleDisplayName: LightFood
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  LightFoodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LightFoodTests
    dependencies:
      - target: LightFood
